services:
  postgres:
    image: postgres:16
    container_name: ams-solution-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ams_agentic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ams_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  ams_postgres_data:
